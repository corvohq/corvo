name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: corvo-linux-amd64
          - os: ubuntu-latest
            artifact: corvo-linux-arm64
            cross: aarch64-linux
          - os: macos-latest
            artifact: corvo-darwin-arm64
          - os: macos-latest
            artifact: corvo-darwin-amd64
            cross: x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: |
          BUILD_ARGS="-Drelease"
          if [ -n "${{ matrix.cross }}" ]; then
            BUILD_ARGS="$BUILD_ARGS -Dtarget=${{ matrix.cross }}"
          fi
          zig build $BUILD_ARGS

      - name: Package binaries
        run: |
          mkdir -p dist
          cp zig-out/bin/corvo dist/
          cp zig-out/bin/corvo-inspect dist/
          chmod +x dist/*
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *rc* ]] || [[ "$TAG" == *beta* ]] || [[ "$TAG" == *alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            corvohq/corvo:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.prerelease == 'false' && 'corvohq/corvo:latest' || '' }}
