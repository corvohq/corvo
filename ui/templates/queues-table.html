<div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm overflow-x-auto">
<table class="w-full text-sm">
<thead>
<tr class="border-b border-zinc-200 dark:border-zinc-800">
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Queue</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Pending</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Active</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Retrying</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Dead</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Completed</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Scheduled</th>
  <th class="px-6 py-3 text-right text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Held</th>
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Status</th>
</tr>
</thead>
<tbody class="divide-y divide-zinc-100 dark:divide-zinc-800">
{{#queues}}
<tr class="hover:bg-zinc-50 dark:hover:bg-zinc-800">
  <td class="px-6 py-3 font-medium"><a href="{{bp}}/ui/queues/{{name}}" class="text-indigo-600 dark:text-indigo-400 hover:underline">{{name}}</a></td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{pending}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{active}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{retrying}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{dead}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{completed_display}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{scheduled}}</td>
  <td class="px-6 py-3 text-right text-zinc-700 dark:text-zinc-300 tabular-nums">{{held}}</td>
  <td class="px-6 py-3">
    {{#paused}}<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-400">paused</span>{{/paused}}
    {{^paused}}<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400">active</span>{{/paused}}
  </td>
</tr>
{{/queues}}
{{^queues}}
<tr><td colspan="9" class="px-6 py-8 text-center text-zinc-500 dark:text-zinc-400">No queues</td></tr>
{{/queues}}
</tbody>
</table>
</div>
