<div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm overflow-x-auto">
<table class="w-full text-sm">
<thead>
<tr class="border-b border-zinc-200 dark:border-zinc-800">
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">ID</th>
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Hostname</th>
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Queues</th>
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Last Heartbeat</th>
  <th class="px-6 py-3 text-left text-xs font-medium text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Started</th>
</tr>
</thead>
<tbody class="divide-y divide-zinc-100 dark:divide-zinc-800">
{{#workers}}
<tr class="hover:bg-zinc-50 dark:hover:bg-zinc-800">
  <td class="px-6 py-3 text-zinc-700 dark:text-zinc-300">{{id}}</td>
  <td class="px-6 py-3 text-zinc-700 dark:text-zinc-300">{{hostname}}</td>
  <td class="px-6 py-3 text-zinc-700 dark:text-zinc-300">{{queues}}</td>
  <td class="px-6 py-3 text-zinc-700 dark:text-zinc-300"><time data-ts="{{last_heartbeat}}">{{last_heartbeat}}</time></td>
  <td class="px-6 py-3 text-zinc-700 dark:text-zinc-300"><time data-ts="{{started_at}}">{{started_at}}</time></td>
</tr>
{{/workers}}
{{^workers}}
<tr><td colspan="5" class="px-6 py-8 text-center text-zinc-500 dark:text-zinc-400">No workers connected</td></tr>
{{/workers}}
</tbody>
</table>
</div>
