<div class="flex flex-wrap gap-2">
  {{#tags}}
  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300"><span class="text-zinc-500 dark:text-zinc-400">{{key}}:</span> {{value}}</span>
  {{/tags}}
</div>
{{#has_more}}
<div class="mt-3">
  <button hx-get="/ui/jobs/{{job_id}}/tags?offset={{next_offset}}" hx-target="closest div" hx-swap="outerHTML" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Show more</button>
</div>
{{/has_more}}
