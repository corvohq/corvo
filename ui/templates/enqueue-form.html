<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  onclick="if(event.target===this)document.getElementById('modal').innerHTML=''">
<div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold">Enqueue Job</h2>
    <button onclick="document.getElementById('modal').innerHTML=''"
      class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
  </div>

  <form id="enqueue-form" onsubmit="return corvoEnqueue(this)">
    <div class="mb-3">
      <label class="block text-sm font-medium text-gray-700 mb-1">Queue</label>
      <input type="text" name="queue" placeholder="default"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div class="mb-3">
      <label class="block text-sm font-medium text-gray-700 mb-1">Payload (JSON)</label>
      <textarea name="payload" rows="4" placeholder='{"key": "value"}'
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono"></textarea>
    </div>

    <details class="mb-3">
      <summary class="text-sm font-medium text-gray-600 cursor-pointer hover:text-gray-900 select-none">
        Advanced Options
      </summary>
      <div class="mt-3 space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
          <select name="priority"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Default</option>
            <option value="low">Low (25)</option>
            <option value="normal">Normal (50)</option>
            <option value="high">High (75)</option>
            <option value="critical">Critical (100)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Max Retries</label>
          <input type="number" name="max_retries" placeholder="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled At</label>
          <input type="datetime-local" name="scheduled_at"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Unique Key</label>
          <input type="text" name="unique_key" placeholder=""
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
      </div>
    </details>

    <div class="flex gap-2 mt-4">
      <button type="submit"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Enqueue</button>
      <button type="button" onclick="document.getElementById('modal').innerHTML=''"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Cancel</button>
    </div>
  </form>
</div>
</div>
