<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - Corvo</title>
  <link rel="icon" href="/ui/favicon.svg">
  <link rel="stylesheet" href="/ui/tailwind.css">
  <script src="/ui/htmx.min.js"></script>
  <script>if(localStorage.getItem('theme')==='dark'||(localStorage.getItem('theme')===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')</script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<div id="toast" class="fixed top-4 right-4 z-50"></div>

<!-- Mobile sidebar overlay — md:hidden ensures it never shows on desktop -->
<div id="mobile-sidebar" class="fixed inset-0 z-40 hidden md:hidden">
  <div class="absolute inset-0 bg-black/50" onclick="document.getElementById('mobile-sidebar').classList.add('hidden')"></div>
  <div class="absolute inset-y-0 left-0 w-56 bg-zinc-950 flex flex-col z-50">
    <div class="h-14 flex items-center px-4 border-b border-zinc-800">
      <a href="/ui/" class="flex items-center gap-2">
        <img src="/ui/logo-full.svg" alt="Corvo" class="h-6">
      </a>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/ui/" data-nav="/" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="/ui/queues" data-nav="/queues" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3.75 12h16.5m-16.5-5.25h16.5m-16.5 10.5h16.5"/></svg>Queues</a>
      <a href="/ui/scheduled" data-nav="/scheduled" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Scheduled</a>
      <a href="/ui/dead-letter" data-nav="/dead-letter" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>Dead Letter</a>
      <a href="/ui/held" data-nav="/held" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Held Jobs</a>
      <a href="/ui/workers" data-nav="/workers" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 00-16 0"/></svg>Workers</a>
      <a href="/ui/cluster" data-nav="/cluster" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="18" r="1" fill="currentColor"/></svg>Cluster</a>
    </nav>
  </div>
</div>

<div class="flex min-h-screen">

<!-- Sidebar (desktop) -->
<aside class="hidden md:flex w-56 bg-zinc-950 flex-col min-h-screen">
  <div class="h-14 flex items-center px-4 border-b border-zinc-800">
    <a href="/ui/" class="flex items-center gap-2">
      <img src="/ui/logo-full.svg" alt="Corvo" class="h-6">
    </a>
  </div>
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a href="/ui/" data-nav="/" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Dashboard</a>
    <a href="/ui/queues" data-nav="/queues" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Queues</a>
    <a href="/ui/scheduled" data-nav="/scheduled" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Scheduled</a>
    <a href="/ui/dead-letter" data-nav="/dead-letter" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Dead Letter</a>
    <a href="/ui/held" data-nav="/held" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Held Jobs</a>
    <a href="/ui/workers" data-nav="/workers" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Workers</a>
    <a href="/ui/cluster" data-nav="/cluster" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors text-zinc-400 hover:bg-zinc-800 hover:text-white">Cluster</a>
  </nav>
</aside>

<!-- Main content -->
<main class="flex-1 p-4 md:p-6 min-w-0">
<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <button class="md:hidden p-1 text-zinc-600 dark:text-zinc-400" onclick="document.getElementById('mobile-sidebar').classList.remove('hidden')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="text-xl md:text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">{{title}}</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')"
        class="p-2 rounded-md text-zinc-500 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
        <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button hx-get="/ui/partials/enqueue-form" hx-target="#modal" hx-swap="innerHTML"
        class="bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 hover:bg-zinc-800 dark:hover:bg-zinc-200 rounded-md px-3 py-1.5 md:px-4 md:py-2 text-xs md:text-sm font-medium">Enqueue</button>
    </div>
  </div>
  <div id="modal"></div>
{{{content}}}
</div>
</main>

</div>

<script>
document.body.addEventListener('htmx:afterRequest',function(e){
var v=e.detail.requestConfig&&e.detail.requestConfig.verb;
if(!v||v==='get')return;
var t=document.getElementById('toast');if(!t)return;
var ok=e.detail.successful;
var c=ok?'bg-green-600':'bg-red-600';
var m=ok?'Done':'Error';
t.innerHTML='<div class="'+c+' text-white px-4 py-2 rounded shadow text-sm">'+m+'</div>';
setTimeout(function(){t.innerHTML=''},2000)
});
function corvoToggleAll(c){
document.querySelectorAll('.job-cb').forEach(function(cb){cb.checked=c});
corvoUpdateBulk()
}
function corvoUpdateBulk(){
var n=document.querySelectorAll('.job-cb:checked').length;
var bar=document.getElementById('bulk-bar');
var cnt=document.getElementById('bulk-count');
if(bar){bar.classList.toggle('hidden',n===0)}
if(cnt){cnt.textContent=n+' selected'}
}
function corvoBulkAction(action){
var ids=[];
document.querySelectorAll('.job-cb:checked').forEach(function(cb){ids.push(cb.dataset.id)});
if(!ids.length)return;
fetch('/api/v1/jobs/bulk',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({action:action,job_ids:ids})})
.then(function(){location.reload()})
}
(function(){
var p=location.pathname.replace(/^\/ui/,'').replace(/\/$/,'')||'/';
document.querySelectorAll('[data-nav]').forEach(function(a){
var d=a.dataset.nav;
if(d==='/'?(p==='/'||p===''):p.indexOf(d)===0)
a.className=a.className.replace('text-zinc-400 hover:bg-zinc-800 hover:text-white','bg-zinc-800 text-white');
});
})();
function corvoFmtDur(ms){
if(ms<60000)return Math.floor(ms/1000)+'s';
if(ms<3600000)return Math.floor(ms/60000)+'m';
if(ms<86400000)return Math.floor(ms/3600000)+'h';
return Math.floor(ms/86400000)+'d';
}
function corvoFormatTimes(){
var now=Date.now();
document.querySelectorAll('time[data-ts]').forEach(function(el){
var ns=el.dataset.ts;if(!ns||ns.length<13)return;
var ms=Number(ns.slice(0,13));if(!ms)return;
var diff=now-ms;
el.textContent=diff<0?'in '+corvoFmtDur(-diff):corvoFmtDur(diff)+' ago';
el.title=new Date(ms).toISOString();
});
}
corvoFormatTimes();
document.body.addEventListener('htmx:afterSwap',corvoFormatTimes);
function corvoExport(fmt,state,queue){
var body={limit:500};
if(state)body.state=[state];
if(queue)body.queue=queue;
fetch('/api/v1/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
.then(function(r){return r.json()})
.then(function(data){
var jobs=data.jobs||[];
if(fmt==='csv'){
var csv='id,queue,state,priority,attempt,max_retries,created_at\n';
jobs.forEach(function(j){csv+=[j.id,j.queue,j.state,j.priority,j.attempt,j.max_retries,j.created_at].join(',')+'\n'});
corvoDownload(csv,'jobs.csv','text/csv');
}else{corvoDownload(JSON.stringify(jobs,null,2),'jobs.json','application/json')}
});
}
function corvoDownload(content,name,type){
var b=new Blob([content],{type:type});
var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
}
function corvoPayloadCopy(btn){
var el=document.getElementById('job-payload');
if(!el)return;
navigator.clipboard.writeText(el.textContent).then(function(){
btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy'},1500);
});
}
function corvoFilterRows(q){
var rows=document.querySelectorAll('#queue-jobs tbody tr');
q=q.toLowerCase();
rows.forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>=0?'':'none'});
}
function corvoEnqueue(form){
var d=new FormData(form);
var body={queue:d.get('queue')||'default'};
var pl=d.get('payload');
if(pl){try{body.payload=JSON.parse(pl)}catch(e){body.payload=pl}}
var pri=d.get('priority');if(pri)body.priority=pri;
var mr=d.get('max_retries');if(mr!=='')body.max_retries=parseInt(mr,10);
var sa=d.get('scheduled_at');if(sa)body.scheduled_at=new Date(sa).toISOString();
var uk=d.get('unique_key');if(uk)body.unique_key=uk;
fetch('/api/v1/enqueue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
.then(function(r){
var t=document.getElementById('toast');
if(r.ok){
document.getElementById('modal').innerHTML='';
if(t)t.innerHTML='<div class="bg-green-600 text-white px-4 py-2 rounded shadow text-sm">Done</div>';
}else{
if(t)t.innerHTML='<div class="bg-red-600 text-white px-4 py-2 rounded shadow text-sm">Error</div>';
}
if(t)setTimeout(function(){t.innerHTML=''},2000);
});
return false;
}
</script>
</body>
</html>
